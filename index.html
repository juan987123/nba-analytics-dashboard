<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBA Analytics Pro</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #fff; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #1e1e1e; padding: 20px; border-radius: 10px; }
        h1 { text-align: center; color: #ff5722; font-size: 20px; }
        input, button { width: 100%; padding: 12px; margin-top: 10px; border-radius: 5px; border: none; box-sizing: border-box; }
        input { background: #2a2a2a; color: #fff; border: 1px solid #444; }
        button { background: #ff5722; color: #fff; font-weight: bold; cursor: pointer; }
        .result-box { background: #2a2a2a; padding: 15px; border-radius: 5px; margin-top: 15px; }
        .stat-line { display: flex; justify-content: space-between; border-bottom: 1px solid #333; padding: 8px 0; }
        #suggestions { background: #252525; border: 1px solid #444; max-height: 150px; overflow-y: auto; border-radius: 5px; }
        .sugg-item { padding: 10px; cursor: pointer; border-bottom: 1px solid #333; }
        .sugg-item:hover { background: #ff5722; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏀 NBA SofaScore Analytics Pro</h1>
        
        <h3>Buscar Jugador:</h3>
        <input type="text" id="playerInput" placeholder="Escribe un nombre (ej: LeBron, Luka)..." oninput="fetchSuggestions()">
        <div id="suggestions"></div>
        
        <button onclick="searchPlayer()">Consultar Estadísticas</button>

        <div id="result" class="result-box" style="display:none;"></div>
    </div>

    <script>
        async function fetchSuggestions() {
            const q = document.getElementById('playerInput').value;
            const suggBox = document.getElementById('suggestions');
            if (q.length < 2) { suggBox.innerHTML = ''; return; }
            
            try {
                const res = await fetch(`/api/players/suggest?q=${encodeURIComponent(q)}`);
                const data = await res.json();
                suggBox.innerHTML = data.suggestions.map(name => 
                    `<div class="sugg-item" onclick="selectPlayer('${name}')">${name}</div>`
                ).join('');
            } catch (e) {
                suggBox.innerHTML = '';
            }
        }

        function selectPlayer(name) {
            document.getElementById('playerInput').value = name;
            document.getElementById('suggestions').innerHTML = '';
            searchPlayer();
        }

        async function searchPlayer() {
            const name = document.getElementById('playerInput').value;
            const resBox = document.getElementById('result');
            if (!name) return;
            
            resBox.style.display = 'block';
            resBox.innerHTML = 'Cargando datos...';

            try {
                const response = await fetch(`/api/player/${encodeURIComponent(name)}`);
                if (!response.ok) throw new Error('Error en respuesta');
                const data = await response.json();

                resBox.innerHTML = `
                    <h2 style="color:#ff5722; margin-top:0;">${data.full_name}</h2>
                    <div class="stat-line"><span>Equipo:</span> <strong>${data.team}</strong></div>
                    <div class="stat-line"><span>Posición:</span> <strong>${data.position}</strong></div>
                    <div class="stat-line"><span>Puntos por partido:</span> <strong>${data.pts}</strong></div>
                    <div class="stat-line"><span>Asistencias:</span> <strong>${data.ast}</strong></div>
                    <div class="stat-line"><span>Rebotes:</span> <strong>${data.reb}</strong></div>
                    <div class="stat-line"><span>% Tiro de Campo:</span> <strong>${(data.fg_pct * 100).toFixed(1)}%</strong></div>
                `;
            } catch (err) {
                resBox.innerHTML = '<span style="color:#ff4444;">Error al consultar. Intenta nuevamente.</span>';
            }
        }
    </script>
</body>
</html>
